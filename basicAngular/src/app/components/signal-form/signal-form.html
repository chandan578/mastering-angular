<div class="row">
    <div class="col-3">
        <div class="card m-5">
            <div class="card-header text-white bg-success">
                <h6>Employee Form</h6>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <input type="text" [formField]="empForm.empName" class="form-control"
                        placeholder="Enter Employee name">
                    @if(empForm.empName().touched()){
                    <div class="text-danger">
                        @for(item of empForm.empName().errors(); track $index){
                        {{item.message}}
                        }
                    </div>
                    }
                </div>
                <div class="mb-3">
                    <input type="text" [formField]="empForm.empCity" class="mt-3 form-control"
                        placeholder="Enter Employee city">
                    @if(empForm.empCity().touched()){
                    <div class="text-danger">
                        @for(item of empForm.empCity().errors(); track $index){
                        {{item.message}}
                        }
                    </div>
                    }
                </div>
                <div class="mb-3">
                    <input type="text" [formField]="empForm.empState" class="form-control" placeholder="Enter Employee state">
                </div>
                <button class="btn btn-success mt-3" (click)="saveEmpData()">Save Emp</button>
            </div>
        </div>

    </div>
</div>
